# Phục vụ bundle tĩnh và chuyển tiếp /api sang gateway.
#
# Vì sao nginx chứ không phải `vite preview`: vite preview cần vite (và cả
# plugin React) hiện diện lúc chạy để nạp vite.config.js — tức ảnh runtime phải
# mang theo toàn bộ công cụ build. Bundle đã build ra chỉ là file tĩnh; phục vụ
# nó bằng nginx cho ảnh ~50MB thay vì ~400MB, và không có tiến trình Node nào
# phải chạy.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # nginx không biết đuôi .geojson nên mặc định trả application/octet-stream,
    # mà kiểu đó không nằm trong gzip_types → file 1,2MB gửi đi nguyên khối.
    types { application/json json geojson; }

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;          # GeoJSON quận/huyện ~1,2MB → còn ~250KB

    # Ứng dụng một trang: mọi đường dẫn không khớp file đều trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Frontend chỉ biết "/api" — nó không cần biết gateway ở đâu.
    location /api/ {
        proxy_pass http://api-gateway:8090/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
